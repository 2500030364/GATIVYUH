services:
  - type: web
    name: gativyuh-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # SQLite is retained for the demo. Render's default filesystem is ephemeral;
    # runtime database writes may be lost after a restart or redeploy.

  - type: web
    name: gativyuh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://YOUR-GATIVYUH-BACKEND.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
